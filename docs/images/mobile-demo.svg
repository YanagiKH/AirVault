<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">AirVault mobile authorization</title><desc id="desc">A phone scans a one-time AirVault QR authorization, previews received files, and verifies their integrity</desc>
  <defs><linearGradient id="m" x2="1" y2="1"><stop stop-color="#49D9E8"/><stop offset="1" stop-color="#5D8BFF"/></linearGradient></defs>
  <rect width="960" height="600" rx="28" fill="#07111E"/>
  <rect x="55" y="48" width="260" height="504" rx="38" fill="#101D2D" stroke="#395674" stroke-width="4"/><rect x="75" y="75" width="220" height="450" rx="25" fill="#F7FAFC"/>
  <text x="104" y="120" fill="#07111E" font-family="sans-serif" font-size="24" font-weight="800">Scan to verify</text><rect x="105" y="150" width="160" height="160" fill="#fff" stroke="#D5DEE7"/>
  <g fill="#07111E"><path d="M116 161h48v48h-48zm9 9v30h30v-30zM206 161h48v48h-48zm9 9v30h30v-30zM116 251h48v48h-48zm9 9v30h30v-30z"/><path d="M178 165h13v13h-13zm-7 25h19v12h-19zm27 27h14v14h-14zm-30 12h18v22h-18zm26 14h18v12h-18zm25-21h30v13h-30zm-2 25h12v35h-12zm17 7h20v20h-20zm-60 14h30v14h-30z"/></g>
  <text x="107" y="348" fill="#5A6B7D" font-family="sans-serif" font-size="14">One-time PIN alternative</text><text x="114" y="392" fill="#07111E" font-family="monospace" font-size="35" font-weight="800" letter-spacing="5">731 409</text><rect x="105" y="435" width="160" height="48" rx="12" fill="url(#m)"/><text x="140" y="466" fill="#07111E" font-family="sans-serif" font-size="16" font-weight="700">Verify sender</text>
  <path d="M360 298h110" stroke="#49D9E8" stroke-width="5" stroke-linecap="round"/><path d="m454 283 20 15-20 15" fill="none" stroke="#49D9E8" stroke-width="5" stroke-linecap="round"/>
  <rect x="505" y="75" width="400" height="450" rx="24" fill="#0D1B2D" stroke="#294764" stroke-width="2"/><text x="540" y="120" fill="#49D9E8" font-family="sans-serif" font-size="13" letter-spacing="2">SECURITY PREFLIGHT PASSED</text><text x="540" y="158" fill="#E7F2FF" font-family="sans-serif" font-size="25" font-weight="800">Review incoming files</text>
  <g font-family="sans-serif"><rect x="540" y="188" width="330" height="58" rx="12" fill="#091827"/><circle cx="568" cy="217" r="13" fill="#173C53"/><text x="592" y="214" fill="#E7F2FF" font-size="16">travel-photos.zip</text><text x="592" y="234" fill="#8BA0BA" font-size="12">84.2 MiB · data file</text><rect x="540" y="258" width="330" height="58" rx="12" fill="#091827"/><circle cx="568" cy="287" r="13" fill="#173C53"/><text x="592" y="284" fill="#E7F2FF" font-size="16">notes.pdf</text><text x="592" y="304" fill="#8BA0BA" font-size="12">1.8 MiB · document</text></g>
  <g fill="none" stroke="#8FF6C3" stroke-width="3"><path d="m550 351 8 8 16-19"/><path d="m550 386 8 8 16-19"/><path d="m550 421 8 8 16-19"/></g><g fill="#BFEBD5" font-family="sans-serif" font-size="14"><text x="588" y="356">Sender identity signature verified</text><text x="588" y="391">Paths and file limits validated</text><text x="588" y="426">SHA-256 commitments received</text></g>
  <rect x="540" y="455" width="145" height="46" rx="11" fill="#13263B" stroke="#395674"/><text x="585" y="484" fill="#E7F2FF" font-family="sans-serif" font-size="15">Decline</text><rect x="700" y="455" width="170" height="46" rx="11" fill="url(#m)"/><text x="730" y="484" fill="#07111E" font-family="sans-serif" font-size="15" font-weight="700">Accept securely</text>
</svg>

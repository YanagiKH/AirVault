<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">AirVault authenticated handshake</title><desc id="desc">Six-stage dynamic key exchange and transfer verification sequence</desc>
  <defs><linearGradient id="s"><stop stop-color="#49D9E8"/><stop offset="1" stop-color="#5D8BFF"/></linearGradient></defs><rect width="1100" height="560" rx="28" fill="#07111E"/><text x="550" y="58" text-anchor="middle" fill="#E7F2FF" font-family="sans-serif" font-size="28" font-weight="800">Authenticated transfer handshake</text>
  <path d="M110 170H990M110 360H990" stroke="#21344D" stroke-width="4"/>
  <g font-family="sans-serif" text-anchor="middle"><g><circle cx="140" cy="170" r="36" fill="url(#s)"/><text x="140" y="180" fill="#07111E" font-size="25" font-weight="900">1</text><text x="140" y="232" fill="#E7F2FF" font-size="16" font-weight="700">Identity</text><text x="140" y="258" fill="#8BA0BA" font-size="13">Ed25519 ID</text></g><g><circle cx="345" cy="170" r="36" fill="url(#s)"/><text x="345" y="180" fill="#07111E" font-size="25" font-weight="900">2</text><text x="345" y="232" fill="#E7F2FF" font-size="16" font-weight="700">Ephemeral keys</text><text x="345" y="258" fill="#8BA0BA" font-size="13">X25519 per transfer</text></g><g><circle cx="550" cy="170" r="36" fill="url(#s)"/><text x="550" y="180" fill="#07111E" font-size="25" font-weight="900">3</text><text x="550" y="232" fill="#E7F2FF" font-size="16" font-weight="700">Out-of-band proof</text><text x="550" y="258" fill="#8BA0BA" font-size="13">PIN or QR secret</text></g><g><circle cx="755" cy="170" r="36" fill="url(#s)"/><text x="755" y="180" fill="#07111E" font-size="25" font-weight="900">4</text><text x="755" y="232" fill="#E7F2FF" font-size="16" font-weight="700">Session keys</text><text x="755" y="258" fill="#8BA0BA" font-size="13">HKDF-SHA-256</text></g><g><circle cx="960" cy="170" r="36" fill="url(#s)"/><text x="960" y="180" fill="#07111E" font-size="25" font-weight="900">5</text><text x="960" y="232" fill="#E7F2FF" font-size="16" font-weight="700">Manifest review</text><text x="960" y="258" fill="#8BA0BA" font-size="13">Approve before data</text></g>
  <rect x="180" y="325" width="740" height="145" rx="22" fill="#0D1B2D" stroke="#31506E"/><text x="550" y="367" fill="#49D9E8" font-size="14" letter-spacing="2">6 · ENCRYPTED FILE STREAM</text><text x="550" y="408" fill="#E7F2FF" font-size="21" font-weight="700">AES-256-GCM chunks with sequence-bound AAD</text><text x="550" y="441" fill="#8FF6C3" font-size="15">Final SHA-256 verification · local malware scan · atomic save</text></g>
</svg>

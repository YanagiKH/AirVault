<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">AirVault security architecture</title><desc id="desc">Two authenticated devices exchange only encrypted packets through a content-blind relay</desc>
  <defs><linearGradient id="x"><stop stop-color="#49D9E8"/><stop offset="1" stop-color="#5D8BFF"/></linearGradient></defs><rect width="1100" height="520" rx="28" fill="#07111E"/>
  <text x="550" y="60" text-anchor="middle" fill="#E7F2FF" font-family="sans-serif" font-size="28" font-weight="800">Content-blind transfer architecture</text>
  <g font-family="sans-serif"><rect x="65" y="145" width="270" height="230" rx="22" fill="#0D1B2D" stroke="#31506E" stroke-width="2"/><circle cx="200" cy="195" r="34" fill="url(#x)"/><text x="200" y="205" text-anchor="middle" fill="#07111E" font-size="28" font-weight="900">A</text><text x="200" y="258" text-anchor="middle" fill="#E7F2FF" font-size="22" font-weight="700">Sending device</text><text x="200" y="292" text-anchor="middle" fill="#8BA0BA" font-size="15">Ed25519 identity</text><text x="200" y="319" text-anchor="middle" fill="#8BA0BA" font-size="15">X25519 ephemeral key</text><text x="200" y="346" text-anchor="middle" fill="#8FF6C3" font-size="15">Encrypts before upload</text>
  <rect x="415" y="175" width="270" height="170" rx="22" fill="#101B2B" stroke="#6A5278" stroke-width="2"/><text x="550" y="222" text-anchor="middle" fill="#E7F2FF" font-size="22" font-weight="700">Ciphertext relay</text><text x="550" y="258" text-anchor="middle" fill="#B7A3C3" font-size="15">Authenticated routing only</text><text x="550" y="285" text-anchor="middle" fill="#B7A3C3" font-size="15">No keys · no filenames</text><text x="550" y="312" text-anchor="middle" fill="#FFB9C0" font-size="15">Cannot decrypt payloads</text>
  <rect x="765" y="145" width="270" height="230" rx="22" fill="#0D1B2D" stroke="#31506E" stroke-width="2"/><circle cx="900" cy="195" r="34" fill="url(#x)"/><text x="900" y="205" text-anchor="middle" fill="#07111E" font-size="28" font-weight="900">B</text><text x="900" y="258" text-anchor="middle" fill="#E7F2FF" font-size="22" font-weight="700">Receiving device</text><text x="900" y="292" text-anchor="middle" fill="#8BA0BA" font-size="15">PIN / QR verification</text><text x="900" y="319" text-anchor="middle" fill="#8BA0BA" font-size="15">Manifest safety scan</text><text x="900" y="346" text-anchor="middle" fill="#8FF6C3" font-size="15">Decrypts after approval</text></g>
  <path d="M335 235h80M685 235h80" stroke="#49D9E8" stroke-width="5"/><path d="m397 220 20 15-20 15m350-30 20 15-20 15" fill="none" stroke="#49D9E8" stroke-width="5"/><path d="M765 295h-80M415 295h-80" stroke="#5D8BFF" stroke-width="5"/><path d="m703 280-20 15 20 15m-350-30-20 15 20 15" fill="none" stroke="#5D8BFF" stroke-width="5"/>
  <text x="550" y="445" text-anchor="middle" fill="#8BA0BA" font-family="sans-serif" font-size="16">TLS protects routing metadata in transit; application-layer E2EE protects file data from the relay.</text>
</svg>

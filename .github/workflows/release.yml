name: Build release artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/set-release-version.mjs"
      - "scripts/set-release-version.test.mjs"
      - "scripts/android-emulator-smoke.sh"
      - "apps/desktop/**"
      - "apps/android/**"
      - "packages/protocol/**"
      - "native/core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and validate semantic version
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
            command: package:windows
          - platform: Linux
            os: ubuntu-24.04
            command: package:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply tag version
        shell: bash
        run: node scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Configure Windows signing
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "AIRVAULT_WINDOWS_SIGNED=true" >> "$GITHUB_ENV"
          elif [[ -z "${CSC_LINK:-}" && -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "AIRVAULT_WINDOWS_SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::Windows signing secrets are absent; producing an explicitly labelled unsigned validation installer."
          else
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD must either both be configured or both be absent."
            exit 1
          fi
      - name: Package desktop installer
        run: npm run ${{ matrix.command }} -w @airvault/desktop
      - name: Label unsigned Windows installer
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AIRVAULT_WINDOWS_SIGNED:-false}" == "false" ]]; then
            shopt -s nullglob
            installers=(apps/desktop/release/*.exe)
            (( ${#installers[@]} > 0 )) || { echo "No Windows installer was produced"; exit 1; }
            for installer in "${installers[@]}"; do
              mv "$installer" "${installer%.exe}-unsigned.exe"
            done
          fi
      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android APK
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: release
    env:
      KEYSTORE_BASE64: ${{ secrets.AIRVAULT_ANDROID_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_AIRVAULT_KEYSTORE_PASSWORD: ${{ secrets.AIRVAULT_ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_AIRVAULT_KEY_ALIAS: ${{ secrets.AIRVAULT_ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_AIRVAULT_KEY_PASSWORD: ${{ secrets.AIRVAULT_ANDROID_KEY_PASSWORD }}
      SCANDIT_LICENSE_KEY: ${{ secrets.SCANDIT_LICENSE_KEY }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: "9.5.0"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Configure Android signing
        run: |
          set -euo pipefail
          values=(
            "$KEYSTORE_BASE64"
            "$ORG_GRADLE_PROJECT_AIRVAULT_KEYSTORE_PASSWORD"
            "$ORG_GRADLE_PROJECT_AIRVAULT_KEY_ALIAS"
            "$ORG_GRADLE_PROJECT_AIRVAULT_KEY_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if (( configured == 4 )); then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/airvault-release.jks"
            echo "ORG_GRADLE_PROJECT_AIRVAULT_KEYSTORE_FILE=$RUNNER_TEMP/airvault-release.jks" >> "$GITHUB_ENV"
            echo "AIRVAULT_ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          elif (( configured == 0 )); then
            echo "AIRVAULT_ANDROID_SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::Android signing secrets are absent; producing an explicitly labelled debug-signed validation APK."
          else
            echo "::error::All four AIRVAULT_ANDROID signing secrets must be configured together."
            exit 1
          fi
      - name: Build Android APK
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          mkdir -p release
          if [[ "$AIRVAULT_ANDROID_SIGNED" == "true" ]]; then
            gradle -p apps/android clean lintRelease testReleaseUnitTest assembleRelease --no-daemon \
              -PAIRVAULT_VERSION_NAME="$VERSION" \
              -PAIRVAULT_VERSION_CODE="$GITHUB_RUN_NUMBER"
            cp apps/android/app/build/outputs/apk/release/app-release.apk "release/AirVault-$VERSION-android.apk"
            echo "AIRVAULT_RELEASE_APK=release/AirVault-$VERSION-android.apk" >> "$GITHUB_ENV"
            echo "AIRVAULT_RELEASE_PACKAGE=io.airvault.mobile" >> "$GITHUB_ENV"
          else
            gradle -p apps/android clean lintDebug testDebugUnitTest assembleDebug --no-daemon \
              -PAIRVAULT_VERSION_NAME="$VERSION" \
              -PAIRVAULT_VERSION_CODE="$GITHUB_RUN_NUMBER"
            cp apps/android/app/build/outputs/apk/debug/app-debug.apk "release/AirVault-$VERSION-android-debug.apk"
            echo "AIRVAULT_RELEASE_APK=release/AirVault-$VERSION-android-debug.apk" >> "$GITHUB_ENV"
            echo "AIRVAULT_RELEASE_PACKAGE=io.airvault.mobile.debug" >> "$GITHUB_ENV"
          fi
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-start the exact release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-emulator-smoke.sh "$AIRVAULT_RELEASE_APK" "$AIRVAULT_RELEASE_PACKAGE" android-release-emulator-evidence
      - name: Upload release emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-emulator
          path: android-release-emulator-evidence
          if-no-files-found: warn
      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error
          compression-level: 0

  native:
    name: Native core ${{ matrix.platform }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build
        run: |
          cmake -S native/core -B native/core/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=native/core/stage
          cmake --build native/core/build --config Release --parallel
          ctest --test-dir native/core/build -C Release --output-on-failure
          cmake --install native/core/build --config Release
      - name: Archive native package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          mkdir -p release
          cmake -E tar cf "release/AirVault-$VERSION-native-$PLATFORM.zip" --format=zip native/core/stage
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [validate-tag, desktop, android, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Write artifact security notice
        run: |
          set -euo pipefail
          {
            echo "# Artifact security status"
            echo
            if compgen -G "dist/*-unsigned.exe" > /dev/null; then
              echo "- Windows assets ending in \`-unsigned.exe\` are validation installers without Authenticode signing."
            else
              echo "- The Windows installer was built with the protected release signing configuration."
            fi
            if compgen -G "dist/*-android-debug.apk" > /dev/null; then
              echo "- Android assets ending in \`-android-debug.apk\` use a runner-generated debug certificate and are for testing only."
            else
              echo "- The Android APK was built with the protected release signing configuration."
            fi
            echo "- Verify every downloaded file against \`SHA256SUMS.txt\` and the GitHub artifact attestation."
          } > dist/ARTIFACT_SECURITY.md
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/**
      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists and remains immutable."
            exit 0
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag_options=(--verify-tag)
          else
            tag_options=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" dist/* "${tag_options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file dist/ARTIFACT_SECURITY.md \
            --title "AirVault $RELEASE_TAG"

  release-status:
    name: Release artifact gate
    if: always()
    needs: [validate-tag, desktop, android, native, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish aggregate commit status
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_SUCCESS: ${{ needs.validate-tag.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' && needs.native.result == 'success' && needs.publish.result == 'success' }}
        run: |
          set -euo pipefail
          state=failure
          description="One or more release artifact jobs failed"
          if [[ "$ALL_SUCCESS" == "true" ]]; then
            state=success
            description="All release artifacts built, verified, and published"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="AirVault/Build release artifacts" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == "success" ]]
